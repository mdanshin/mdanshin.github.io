---
layout: default
---
<div class="container">
{% assign page_title_en = page.title_en | default: page.title %}
<h3 class="font-weight-bold spanborder" data-page-title>
    <span data-lang="ru">{{page.title}}</span>
    <span data-lang="en">{{page_title_en}}</span>
</h3>
<div class="row">
    <div class="col-md-8">
    {% if page.image %} 
    <img class="card-img-top mb-5 shadow-lg" src="{% if page.image contains "://" %}{{ page.image }}{% else %}{{ page.image | absolute_url }}{% endif %}" alt="{{ page.title }}"> 
    {% endif %} 
    <div class="page-content">
        {{ content }}
        <!-- Comments -->
        {% if page.comments == true %}
        {% include comments.html %}
        {% endif %}
    </div>
    </div>
    <div class="col-md-4">
        {% include sidebar.html %}
    </div>
</div>  
</div>
