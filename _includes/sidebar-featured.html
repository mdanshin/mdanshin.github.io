<div class="sticky-top sticky-top-offset">
    <h4 class="font-weight-bold spanborder"><span>
        <span data-lang="ru">Популярные статьи</span>
        <span data-lang="en">Popular Posts</span>
    </span></h4>  
    <ol class="list-featured">				
        {% for post in site.tags.featured %}                
            <li class="mb-4">
            <span>
                <h6 class="font-weight-bold">
                    {% assign post_title_en = post.title_en | default: post.title %}
                    <a href="{{site.baseurl}}{{ post.url }}" class="text-dark">
                        <span data-lang="ru">{{ post.title }}</span>
                        <span data-lang="en">{{ post_title_en }}</span>
                    </a>
                </h6>
                <span class="d-block text-muted">
                    <span data-lang="ru">Категория</span>
                    <span data-lang="en">Category</span>
                    <span class="catlist">
                    {% for category in post.categories %}
                    <a class="text-capitalize text-muted smoothscroll" href="{{site.baseurl}}/categories.html#{{ category | downcase }}">{{ category }}</a><span class="sep">, </span>
                    {% endfor %}
                    </span>
                </span>
            </span>
            </li>                
        {% endfor %}   
    </ol>
</div>
