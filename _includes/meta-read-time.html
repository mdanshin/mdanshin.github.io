<span class="reading-time">
  {% assign words = content | number_of_words %}
  {% if words < 360 %}
    <span data-lang="ru">1 мин. на прочтение</span>
    <span data-lang="en">1 min read</span>
  {% else %}
    {% assign mins = words | divided_by:180 %}
    <span data-lang="ru">{{ mins }} мин. на прочтение</span>
    <span data-lang="en">{{ mins }} min read</span>
  {% endif %}
</span>
